apiVersion: 1
providers:
  - name: 'Factory Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
datasources:
  - name: Factory_DB
    type: grafana-postgresql-datasource
    uid: factory-postgres-ds
    access: proxy
    url: timescaledb:5432
    user: grafana_reader
    database: factory_db
    isDefault: true
    editable: true
    jsonData:
      sslmode: disable
      timescaledb: true
    secureJsonData:
      password: Grafana-Read-26