# ==========================================
# 1. Management & Edge 區 (192.168.1.x)
# ==========================================
router[0]=vlan_mgmt
gateway[0]=vlan_mgmt
scada_server[0]=vlan_mgmt

# ==========================================
# 2. Safety Zone 區 (192.168.10.x)
# ==========================================
router[1]=vlan_safety
temp_sensor[0]=vlan_safety
co_sensor[0]=vlan_safety
h2_sensor[0]=vlan_safety
hf_sensor[0]=vlan_safety
smoke_sensor[0]=vlan_safety

# ==========================================
# 3. Sorting Zone 區 (192.168.20.x)
# ==========================================
router[2]=vlan_sorting
voltage_sensor[0]=vlan_sorting
vibration_sensor[0]=vlan_sorting
weight_sensor[0]=vlan_sorting
magnetic_sensor[0]=vlan_sorting
vision_sensor[0]=vlan_sorting



# ==========================================
# 5. 指定已預載 Node-RED / DB / Grafana 的映像檔
# ==========================================
gateway[image]="my-iot-node"
scada_server[image]="my-iot-node"
gateway[bridged]=true
scada_server[bridged]=true
gateway[port]="1880:1880/tcp"
scada_server[port]="3000:3000/tcp"