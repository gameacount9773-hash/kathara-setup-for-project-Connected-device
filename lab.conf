# ==========================================
# 1. 網路線連接 (VLAN 拓樸)
# ==========================================
sensor1[0]=vlan_sensor
sensor2[0]=vlan_sensor

gateway[0]=vlan_sensor
gateway[1]=vlan_mgmt

scada_server[0]=vlan_mgmt

# ==========================================
# 2. 指定使用已安裝軟體的映像檔
# ==========================================
gateway[image]="my-iot-node"
scada_server[image]="my-iot-node"

# ==========================================
# 3. 開啟 Bridged 權限與 Port 轉發
# ==========================
# 允許將容器連接埠映射到宿主機 (必須加上 bridged=true)
gateway[bridged]=true
scada_server[bridged]=true

# 將 Gateway 的 Node-RED 映射到本機 1880
gateway[port]="1880:1880/tcp"

# 將 scada_server 的 Grafana 映射到本機 3000
scada_server[port]="3000:3000/tcp"