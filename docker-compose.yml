services:
  # 1. Database server (PostgreSQL + TimescaleDB)
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: iot_database
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=factory_db
    volumes:
      - ./db-data:/var/lib/postgresql/data
      - ./shared/init.sql:/docker-entrypoint-initdb.d/init.sql

  # 2. Dashboard server (Grafana)
  grafana:
    image: grafana/grafana:latest
    container_name: iot_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana-data:/var/lib/grafana
      - ./shared/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
    depends_on:
      - timescaledb

  # 3. Workflow automation server (n8n + auto-initialization)
  n8n:
    image: n8nio/n8n:latest
    container_name: iot_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=voltcycle-team-key-2026
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./shared:/shared
    depends_on:
      - timescaledb
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        (
          if [ ! -f /home/node/.n8n/.initialized ]; then
            echo "Waiting for n8n to start (25s)..."
            sleep 25

            echo "Creating owner account..."
            node -e "fetch('http://localhost:5678/rest/owner/setup', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email:'admin@local.test',firstName:'IoT',lastName:'Admin',password:'Admin1234'})}).catch(() => console.log('Owner account already exists'))"

            if [ -f /shared/credential.json ]; then
              echo "Importing credentials..."
              n8n import:credentials --input=/shared/credential.json || true
            fi

            if [ -f /shared/flow.json ]; then
              echo "Importing workflow..."
              n8n import:workflow --input=/shared/flow.json || true
            fi

            touch /home/node/.n8n/.initialized
            echo "Auto-initialization complete!"
          fi
        ) &
        exec n8n start
